[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-hpc-manager"
version = "0.1.0"
description = "Terminal administration tool for AIC HPC Kubernetes users, namespaces and storage policies"
requires-python = ">=3.10"
dependencies = [
  "kubernetes>=31.0.0,<34.0.0",
  "textual>=1.0.0,<2.0.0",
  "PyYAML>=6.0.1,<7.0",
]

[project.scripts]
aic-hpc-manager = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]
